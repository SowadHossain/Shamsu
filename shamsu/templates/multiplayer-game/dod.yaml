category: multiplayer-game
# The checks are automated in template/smoke/dod.mjs (headless Playwright for the
# client, the server API for persistence). Run them with:
#   cd template && npm install && npm run build
#   cd smoke && npm install && npx playwright install chromium && npm test
runner: "node smoke/dod.mjs"
items:
  - id: build.succeeds
    description: "Client and server build with no errors."
    severity: required
  - id: menu.renders
    description: "Main menu is visible on load."
    severity: required
  - id: net.connects
    description: "Creating a room opens a Colyseus connection and returns a room code."
    severity: required
  - id: lobby.works
    description: "A second client joins by code; both clients list two players."
    severity: required
  - id: net.two_players_visible
    description: "In game, each of two clients renders two player objects."
    severity: required
  - id: hud.visible
    description: "The HUD is on screen during play."
    severity: required
  - id: loop.runs
    description: "The game loop advances (tick count and player position change over time)."
    severity: required
  - id: end.condition
    description: "The win condition can fire and shows the game over screen on all clients."
    severity: required
  - id: score.persists
    description: "After a match ends, the SQLite leaderboard has an entry for the players."
    severity: required
