[project]
name = "shamsu"
version = "0.4.0b1"
description = "Local-first coding agent for workspace Q&A, fixes, projects, and web research"
requires-python = ">=3.11"
dependencies = [
    # CLI + output
    "prompt_toolkit>=3.0",
    "rich>=13.7",

    # LLM client
    "httpx>=0.27",
    "ollama>=0.4",
    "pydantic>=2.7",
    "instructor>=1.3",
    "json-repair>=0.25",
    "tokenizers>=0.21",

    # Retrieval — zero/near-zero RAM cost (see ENGINEERING_HARNESS.md)
    "rank_bm25>=0.2",
    # SQLite FTS5 is stdlib — no extra dependency

    # Code parsing
    "tree-sitter>=0.23",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-html",

    # PRD parsing
    "mistletoe>=1.3",
    "pdfplumber>=0.10",
    "pypdfium2>=5.0",
    "rapidocr>=3.9,<4",
    "onnxruntime>=1.20",

    # Caching
    "diskcache>=5.6",

    # System
    "psutil>=5.9",
    "watchdog>=4.0",
    "playwright>=1.54",
    "trafilatura>=1.12",

    # Keyword extraction (near-zero RAM, no model)
    "yake>=0.4.8",
    "PyYAML>=6.0",

    # External Model Context Protocol servers
    "mcp>=1.28,<2",
    "keyring>=25.0",
    "filelock>=3.15",
]

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.0",
    "imageio-ffmpeg>=0.5",
    "sounddevice>=0.4",
    # Speaking a reply back. CPU only by design - `kokoro-onnx[gpu]` is
    # deliberately NOT used, because the GPU belongs to the coder model, and
    # the ONNX session is pinned to CPUExecutionProvider besides.
    "kokoro-onnx>=0.6.1",
    "numpy>=2.0",
]

# The fallback voice: smaller and instant, but audibly synthetic. Worth having
# on a machine that cannot spare 353MB for the Kokoro model, and nothing else
# depends on it - `auto` skips straight past a missing engine.
voice-piper = [
    "piper-tts>=1.7",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

# NOTE: intentionally NO [project.scripts] entry point. SHAMSU ships a managed
# launcher at ~/.shamsu/bin (see scripts/install.*), which sets PYTHONUTF8 and
# resolves the workspace. A pip console-script named `shamsu` would create a
# second, competing `shamsu.exe` in .venv/Scripts and shadow the launcher when
# the venv is on PATH. Run via the launcher or `python -m shamsu.cli.repl`.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# A ceiling per test, so one hung subprocess cannot take the suite with it.
# Measured 2026-08-31: `test_command_runner_installs_only_through_created_project_venv`
# creates a real venv and runs ensurepip; it normally takes 12s and once wedged
# at 0% CPU for 35 minutes, with the whole run stuck behind it. Generous enough
# that no honest test is near it - the slowest is ~24s.
timeout = 300
# `thread` rather than `signal`: signal-based timeouts do not fire on Windows,
# which is where this suite runs.
timeout_method = "thread"
# Two orthogonal axes, assigned automatically in tests/conftest.py.
#
#   LEVEL  - where a test sits in the pyramid: how much of the system runs.
#   INTENT - why the test exists at all. A regression test can be a unit test
#            OR a system test; intent is not a level, so it is a separate mark.
#
# An auto-assigned level can always be overridden on the test itself - an
# explicit marker wins over the derived one.
markers = [
    "unit: solitary - pure logic, no filesystem, no agent loop",
    "integration: sociable - real collaborators against a scripted model client",
    "system: full request path, real subprocess or local server, no live model",
    "regression: pins a specific field defect so it cannot return",
    "contract: asserts an assumption about an external interface (Ollama, MCP)",
    "negative: asserts something must NOT happen",
    "guard: meta-test protecting the test infrastructure itself",
]

[tool.ruff]
line-length = 100
target-version = "py311"
