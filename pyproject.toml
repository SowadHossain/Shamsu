[project]
name = "shamsu"
version = "0.4.0b1"
description = "Local-first coding agent for workspace Q&A, fixes, projects, and web research"
requires-python = ">=3.11"
dependencies = [
    # CLI + output
    "prompt_toolkit>=3.0",
    "rich>=13.7",

    # LLM client
    "httpx>=0.27",
    "ollama>=0.4",
    "pydantic>=2.7",
    "instructor>=1.3",
    "json-repair>=0.25",
    "tokenizers>=0.21",

    # Retrieval — zero/near-zero RAM cost (see ENGINEERING_HARNESS.md)
    "rank_bm25>=0.2",
    # SQLite FTS5 is stdlib — no extra dependency

    # Code parsing
    "tree-sitter>=0.23",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-html",

    # PRD parsing
    "mistletoe>=1.3",
    "pdfplumber>=0.10",

    # Caching
    "diskcache>=5.6",

    # System
    "psutil>=5.9",
    "watchdog>=4.0",
    "playwright>=1.54",
    "trafilatura>=1.12",

    # Keyword extraction (near-zero RAM, no model)
    "yake>=0.4.8",
    "PyYAML>=6.0",

    # External Model Context Protocol servers
    "mcp>=1.28,<2",
    "keyring>=25.0",
    "filelock>=3.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

# NOTE: intentionally NO [project.scripts] entry point. SHAMSU ships a managed
# launcher at ~/.shamsu/bin (see scripts/install.*), which sets PYTHONUTF8 and
# resolves the workspace. A pip console-script named `shamsu` would create a
# second, competing `shamsu.exe` in .venv/Scripts and shadow the launcher when
# the venv is on PATH. Run via the launcher or `python -m shamsu.cli.repl`.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
