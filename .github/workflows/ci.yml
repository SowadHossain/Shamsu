name: CI

# Gates SHAMSU v2 (src/shamsu). The archived v1 tree has its own non-gating
# workflow in legacy-ci.yml.
#
# No job here runs a local model. Inference is exercised only on a
# GPU-equipped development machine; the suite runs against a deterministic
# fake (tests/fixtures/fake_model.py) so CI stays fast, hermetic, and
# reproducible.

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "legacy-code/**"
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary:
    name: Legacy import boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Deliberately no install step: the check is stdlib-only and must pass
      # even when the project cannot be built.
      - name: Check that v2 does not reach into legacy-code/
        run: python scripts/check_import_boundary.py --root .

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: boundary
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/ scripts/
      - name: Format check
        run: ruff format --check src/ tests/ scripts/
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest tests/ --tb=short
      - name: Verify the archived tree was not collected
        shell: bash
        run: |
          # A regression here would mean v2's suite silently depends on v1.
          if pytest tests/ --collect-only -q 2>&1 | grep -q "legacy-code"; then
            echo "::error::pytest collected tests from legacy-code/"
            exit 1
          fi
